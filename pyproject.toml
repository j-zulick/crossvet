[project]
name = "crossvet"
version = "1.1.1"
description = "One chat that controls Claude, ChatGPT and other models: use it from Hermes, Cursor or any chat app, and each request goes to a suitable model, with the reason shown."
authors = [
    { name = "Joseph Zulick" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["llm", "multi-model", "llm-router", "model-routing", "mcp", "openai-compatible", "chat"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.24.0",
    "mcp>=1.24,<3",
    "python-dotenv>=1.0.1",
]

[project.urls]
Homepage = "https://github.com/j-zulick/crossvet"
Source = "https://github.com/j-zulick/crossvet"
Issues = "https://github.com/j-zulick/crossvet/issues"
Changelog = "https://github.com/j-zulick/crossvet/blob/main/CHANGELOG.md"

[project.scripts]
crossvet = "crossvet.cli:main"
crossvet-chat = "crossvet.chat.cli:main"

[project.optional-dependencies]
langfuse = ["langfuse>=3"]
otel = ["opentelemetry-sdk>=1.45", "opentelemetry-exporter-otlp-proto-http>=1.45"]
all = ["crossvet[langfuse,otel]"]
dev = ["mypy>=1.11.1", "ruff>=0.6.1"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["crossvet", "crossvet.chat"]
license-files = ["LICENSE"]

[tool.setuptools.package-dir]
"crossvet" = "src/crossvet"
"crossvet.chat" = "src/crossvet/chat"

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "D417",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
"src/crossvet/cli.py" = ["T201"]  # a CLI prints by design
"src/crossvet/chat/cli.py" = ["T201"]  # a CLI prints by design
"src/crossvet/chat/server.py" = ["T201"]  # prints the address it listens on
"src/crossvet/chat/mcp_server.py" = ["T201"]  # prints why it refuses to start

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = ["."]
