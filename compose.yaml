# One command: docker compose up --build
# API on http://localhost:2024 (LangGraph Studio-compatible), web UI on http://localhost:3000.
# Put your keys in .env (copy .env.example). Ports bind to localhost only.
services:
  api:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:2024:2024"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2024/ok', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 30s

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:2024
        NEXT_PUBLIC_ASSISTANT_ID: deep_researcher
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
