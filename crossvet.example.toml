# Crossvet settings. Copy to ~/.config/crossvet/crossvet.toml (or ./crossvet.toml), or run `crossvet init`.
# API keys are NOT stored here: they come from the environment or a .env file (.env.example).
# A request names its model, or gets default_model. Name `auto` (or crossvet/strong, crossvet/cheapest...) to let
# Crossvet choose from the slots below; `crossvet route TEXT` shows what it would pick, and why.

default_model = "sonnet"

# The model menu your chat app shows (GET /v1/models). Any provider:model works even if it is not listed.
models = ["anthropic:claude-opus-5-5", "anthropic:claude-sonnet-5-5", "anthropic:claude-haiku-5-5",
          "openai:gpt-6.1-sol", "openai:gpt-6.1-terra", "openai:gpt-6-luna"]

# Short names you can type instead of provider:model (in /model, ask_model, --model).
[names]
claude = "anthropic:claude-opus-5-5"
opus = "anthropic:claude-opus-5-5"
sonnet = "anthropic:claude-sonnet-5-5"
haiku = "anthropic:claude-haiku-5-5"
gpt = "openai:gpt-6.1-sol"
sol = "openai:gpt-6.1-sol"
terra = "openai:gpt-6.1-terra"
luna = "openai:gpt-6-luna"

[limits]
max_usd_per_day = 5.0       # 0 = no cap
max_usd_per_call = 0.50     # worst case, estimated before the call; needs a price
max_output_tokens = 4000
timeout_seconds = 120       # one model call, start to finish
max_request_bytes = 2000000 # the largest request `crossvet serve` accepts

# Prices in USD per million tokens. The six models above are built in (list prices, checked 2026-11-26).
# Add one for any other model so /cost and the per-call cap can count it:
# [prices."openrouter:vendor/model"]
# input = 1.0
# output = 5.0

# The slots `auto` picks from. The first model in a slot that your keys can call goes first; the rest are the
# ladder it climbs after an error, an empty answer or invalid JSON.
[slots]
quick = ["anthropic:claude-haiku-5-5", "openai:gpt-6-luna"]
balanced = ["anthropic:claude-sonnet-5-5", "openai:gpt-6.1-terra"]
strong = ["anthropic:claude-opus-5-5", "openai:gpt-6.1-sol"]
long = ["anthropic:claude-sonnet-5-5", "openai:gpt-6.1-sol"]
vision = ["anthropic:claude-opus-5-5", "openai:gpt-6.1-sol"]
reviewer = ["openai:gpt-6.1-sol", "anthropic:claude-opus-5-5"]
# Requests that look private (a key, an ID or card number, "confidential", [private]) only go here; empty = refused.
private = []

# Which slot each kind of task starts in (kinds: code, review, writing, summarize, extract, translate, reasoning,
# fresh, quick, general). Hard tasks move up to strong. These are the defaults:
[routes]
code = "strong"
writing = "balanced"
summarize = "quick"

[router]
goal = "auto"          # auto (your slot order) | best | cheapest | fastest
escalate = true        # try the next model after an error, an empty answer or invalid JSON
max_steps = 2          # extra models tried at most
private_auto = true    # keep requests that look private in the private slot
long_chars = 60000     # a request this long goes to the long slot
use = "rules"          # rules | scores: from judged answers, the cheapest model within margin of the best ([score])
margin = 0.3           # score points (1-5) a cheaper model may trail the best by
explore = 0.05         # with use = "scores", this share of requests tries the second choice
min_scores = 20        # judged answers a model needs for a kind before scores count for it
auto_tune = false      # true: `crossvet tune auto` may accept one score route per kind a week, rolled back if scores drop

# Judge a sample of answers to build a leaderboard from your own use (`crossvet score run`, `crossvet leaderboard`).
# Off by default: the answers are sent to a second vendor. Requests that look private are never judged.
[score]
enabled = false
sample = 0.1             # share of answers judged
judge = ""               # "" = the strongest model from another vendor than the answer's
max_usd_per_day = 1.0    # the judge's (and shadow answers') own daily cap
apps = []                # only answers from these apps (api, mcp, terminal...); empty = all
shadow = false           # a cheaper model also answers a sample of judged questions
shadow_sample = 0.05
shadow_model = ""        # "" = the cheapest model in the quick slot

# Where the log is kept ("" = CROSSVET_DB, else ~/.local/share/crossvet/chat.db)
# [store]
# path = ""
# Where decisions, ratings, notes and routes are kept ("" = CROSSVET_LAB_DB, else lab.db next to the log)
# [lab]
# path = ""
