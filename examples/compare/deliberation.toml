# Does deliberation help? Same panel, single round of review vs two deliberation rounds.
# Model names are examples and change over time; `uv run crossvet-setup --compare-plan FILE` writes setups from your available models.

[[setup]]
name = "single-round"
[setup.config]
cross_vendor_review_enabled = true
review_models = "openai:gpt-5.5,anthropic:claude-sonnet-5-5,google_genai:gemini-3.8-flash"
review_deliberation_rounds = 0

[[setup]]
name = "two-rounds"
[setup.config]
cross_vendor_review_enabled = true
review_models = "openai:gpt-5.5,anthropic:claude-sonnet-5-5,google_genai:gemini-3.8-flash"
review_deliberation_rounds = 2
