# LangGraph edition vs Deep Agents edition with the same models and review panel.
# Model names are examples and change over time; `uv run crossvet-setup --compare-plan FILE` writes setups from your available models.

[[setup]]
name = "langgraph"
edition = "langgraph"
[setup.config]
research_model = "openai:gpt-5.5"
cross_vendor_review_enabled = true
review_models = "openai:gpt-5.5,anthropic:claude-sonnet-5-5"
review_reviser_model = "google_genai:gemini-3.8-flash"

[[setup]]
name = "deep-agent"
edition = "deep_agent"
[setup.config]
research_model = "openai:gpt-5.5"
cross_vendor_review_enabled = true
review_models = "openai:gpt-5.5,anthropic:claude-sonnet-5-5"
review_reviser_model = "google_genai:gemini-3.8-flash"
