name: Feature request
description: Suggest a change or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you'd like Crossvet to do. If it changes how a request is routed or checked, say how it would be checked in code.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or prior art
      description: Papers, benchmarks or projects that support the idea (optional).
