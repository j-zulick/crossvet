name: Bug report
description: Something in Crossvet doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting. Please never paste API keys or the contents of your `.env`."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The command or code, the question, and the settings that matter (model names, SEARCH_API, review settings). `uv run crossvet-doctor` output helps; it never prints keys.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Crossvet version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options: [LangGraph (deep_researcher), Deep Agents (deep_agent), Not sure]
  - type: textarea
    id: logs
    attributes:
      label: Error output or Review notes
      render: text
