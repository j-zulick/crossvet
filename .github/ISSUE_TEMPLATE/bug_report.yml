name: Bug report
description: Something in Crossvet doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting. Please never paste API keys or the contents of your `.env`."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran or asked, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The command or request, the chat app (Hermes, Cursor, terminal, other), and the settings that matter. `crossvet chat doctor` output helps; it never prints keys.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Crossvet version
      description: "`crossvet --version`"
      placeholder: "1.0.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output, or what `/why` showed
      render: text
