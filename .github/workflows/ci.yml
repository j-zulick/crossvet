name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # run on any branch: gh workflow run CI --ref <branch>

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      - name: Lint (new modules)
        run: uvx ruff@0.17.4 check src/open_deep_research/cross_vendor_review.py src/open_deep_research/doctor.py src/open_deep_research/setup_wizard.py src/open_deep_research/quickrun.py src/open_deep_research/mcp_server.py src/open_deep_research/approval.py src/open_deep_research/cli.py src/open_deep_research/tracing.py src/open_deep_research/configuration.py tests/unit
      - name: Graph builds
        run: uv run python -c "import open_deep_research.deep_researcher as d; assert 'cross_vendor_review' in d.deep_researcher.get_graph().nodes"
      - name: Unit tests (no API keys, no network)
        run: uv run pytest tests/unit -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json  # pnpm version comes from packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
