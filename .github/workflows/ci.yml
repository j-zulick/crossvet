name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # run on any branch: gh workflow run CI --ref <branch>

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      - name: Lint (new modules)
        run: uvx ruff@0.17.4 check src/open_deep_research/cross_vendor_review.py src/open_deep_research/doctor.py src/open_deep_research/setup_wizard.py src/open_deep_research/quickrun.py src/open_deep_research/gateway_search.py src/open_deep_research/mcp_server.py src/open_deep_research/approval.py src/open_deep_research/cli.py src/open_deep_research/tracing.py src/open_deep_research/compare.py src/open_deep_research/deliberation.py src/open_deep_research/blind_pass.py src/open_deep_research/support_check.py src/open_deep_research/deep_agent.py src/open_deep_research/dataset.py src/open_deep_research/configuration.py src/open_deep_research/models.py src/open_deep_research/bench.py src/open_deep_research/bench_cases.py tests/unit
      - name: Graphs build
        run: |
          uv run python -c "import open_deep_research.deep_researcher as d; assert 'cross_vendor_review' in d.deep_researcher.get_graph().nodes"
          uv run python -c "import open_deep_research.deep_agent as d; assert 'cross_vendor_review' in d.deep_agent.get_graph().nodes"
      - name: Unit tests (no API keys, no network)
        run: uv run pytest tests/unit -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json  # pnpm version comes from packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t crossvet-api:ci .
      - name: Build web image
        run: docker build -t crossvet-web:ci web
      - name: API serves both graphs
        run: |
          docker run -d --name api -p 2024:2024 crossvet-api:ci
          for _ in $(seq 1 30); do curl -sf http://localhost:2024/ok && break; sleep 2; done
          curl -sf -X POST http://localhost:2024/assistants/search -H 'content-type: application/json' -d '{}' \
            | python3 -c "import json,sys; ids=sorted(a['graph_id'] for a in json.load(sys.stdin)); print(ids); assert ids == ['deep_agent', 'deep_researcher']"

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # gitleaks-action lists a pull request's commits
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: crossvet-sbom.spdx.json
