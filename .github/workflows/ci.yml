name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # run on any branch: gh workflow run CI --ref <branch>

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --all-extras
      - name: Lint
        run: uvx ruff@0.17.4 check src tests
      - name: Unit tests (no API keys, no network)
        run: uv run pytest tests/unit -q
      - name: Live tests are skipped without keys
        run: uv run pytest tests/live -q -rs

  light-install:
    # the base install, as a new user gets it: three dependencies, no extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: uv build --wheel
      - name: Install the wheel without extras
        run: |
          uv venv /tmp/light
          uv pip install --python /tmp/light/bin/python dist/*.whl pytest
      - name: Commands run without keys
        run: |
          export PATH=/tmp/light/bin:$PATH
          crossvet --version
          crossvet chat --version
          crossvet chat route "Fix the race condition in this Go worker pool" || [ $? -eq 1 ]
      - name: Tests on the light install
        run: /tmp/light/bin/python -m pytest -q -p no:cacheprovider tests/unit

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # gitleaks-action lists a pull request's commits
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: crossvet-sbom.spdx.json
